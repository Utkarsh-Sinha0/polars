name: Validate bitmap offset 30105
on:
  push:
    branches: [validation/bitmap-offset-30105]
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUSTFLAGS: -C debuginfo=0
jobs:
  bitmap:
    if: ${{ contains(github.event.head_commit.message, 'Rust harness') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned Rust
        run: rustup show
      - name: Prove baseline failure and run full bitmap suite
        run: python tools/validate_bitmap_30105.py
  python:
    if: ${{ !contains(github.event.head_commit.message, 'Rust harness') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned Rust
        run: rustup show
      - name: Install Python test tools
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin pytest numpy hypothesis typing-extensions ruff
          .venv/bin/pip install --no-deps -e ./py-polars
      - name: Build patched runtime from this checkout
        run: |
          source .venv/bin/activate
          maturin develop --manifest-path py-polars/runtime/polars-runtime-32/Cargo.toml
      - name: Lint and format
        working-directory: py-polars
        run: |
          ../.venv/bin/ruff check --no-fix tests/unit/series/test_extend.py tests/unit/series/test_scatter.py tests/unit/dataframe/test_extend.py
          ../.venv/bin/ruff format --check tests/unit/series/test_extend.py tests/unit/series/test_scatter.py tests/unit/dataframe/test_extend.py
          rustup component add rustfmt
          cargo fmt --all --check
      - name: Run regression tests
        working-directory: py-polars
        run: ../.venv/bin/pytest -v tests/unit/series/test_extend.py tests/unit/series/test_scatter.py tests/unit/dataframe/test_extend.py -k 30105
      - name: Run neighboring tests
        working-directory: py-polars
        run: ../.venv/bin/pytest -v tests/unit/series/test_extend.py tests/unit/series/test_scatter.py tests/unit/dataframe/test_extend.py
